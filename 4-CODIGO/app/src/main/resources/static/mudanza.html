<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Pasa lo guardado en el navegador a la dirección actual de NOM: ver js/mudanza.js. -->
  <title>NOM se cambió de dirección</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F5F7; color: #1D1B3A;
      font: 16px/1.45 system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #16151F; color: #E9E8F2; } }
    main { max-width: 24rem; padding: 24px; text-align: center; }
    h1 { font-size: 21px; margin: 0 0 10px; }
    p { margin: 0 0 14px; }
    #estado { opacity: .8; min-height: 1.45em; }
    button { font: inherit; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; }
    #pasar { background: #4B3FD9; color: #fff; font-weight: 600; width: 100%; }
    #pasar:disabled { opacity: .6; cursor: default; }
    #saltar { background: none; color: inherit; text-decoration: underline; opacity: .75; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <div id="vieja">
      <h1>NOM ahora está en www.nom.qd.je</h1>
      <p>Lo que guardaste en este navegador (documentos sin cuenta, copias y cambios sin enviar) se pasa a la dirección
        nueva con un clic. Se abre una ventana un momento y luego sigues allá.</p>
      <p><button id="pasar" type="button">Pasar mis cosas y continuar</button></p>
      <p><button id="saltar" type="button">Ir sin pasar nada</button></p>
    </div>
    <p id="estado" role="status"></p>
  </main>
  <script src="js/mudanza.js"></script>
</body>
</html>
