spring.application.name=nom
# Sin server.address: escucha en todas las interfaces, IPv4 e IPv6. Los demas equipos
# de la LAN entran por la IP del equipo; en el propio equipo, por localhost (que el
# navegador intenta primero por IPv6: fijar 0.0.0.0 lo hacia esperar ~5 s).
# En la Raspberry (la nube) escucha solo en 127.0.0.1: SERVER_ADDRESS en servidor-propio/pi/s6/nom-servidor/run.
server.port=${NOM_PUERTO:8080}
server.compression.enabled=true
# (los .js salen como text/javascript: sin él, la página bajaba 4.2 MB sin comprimir; Cloudflare no los comprime por
# no-transform, así que se comprimen aquí)
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,text/plain,text/markdown,application/manifest+json
# La pagina se revalida en cada carga (si no cambio, el servidor responde 304 sin reenviarla).
# Sin esto el navegador podia seguir usando un .js viejo junto con otros nuevos tras actualizar.
spring.web.resources.cache.cachecontrol.no-cache=true
# Cloudflare no cambia las páginas en el camino (p. ej. no les agrega su script de estadísticas): llegan como salen.
spring.web.resources.cache.cachecontrol.no-transform=true
spring.web.resources.cache.use-last-modified=true
spring.mvc.async.request-timeout=-1
# La API solo recibe JSON y archivos, no formularios en PUT/PATCH/DELETE.
spring.mvc.formcontent.filter.enabled=false
# Las tareas periódicas (guardado, latido, limpieza) no se esperan entre sí en un solo hilo.
spring.task.scheduling.pool.size=3
# Una escritura que no avanza (alguien dejó de leer: se cerró la laptop o el celular perdió el Wi-Fi) se corta a los
# 20 s (antes, 60 s de Tomcat); el canal en vivo de esa persona se cierra y su página se vuelve a conectar al regresar.
server.tomcat.connection-timeout=20s
# Carpeta donde viven usuarios, espacios, documentos y versiones (JSON).
nom.datos=${NOM_DATOS:./datos-nom}
# Anuncio UDP de espacios visibles en la red local (CU-14 / CU-15).
nom.descubrimiento.activo=${NOM_DESCUBRIMIENTO:true}
nom.descubrimiento.puerto=47474
# Requerimiento no funcional (RNF Espacios 1, cambiado el 13-nov-2026): maximo 50 personas conectadas
# a la vez por espacio (y por lo tanto en un mismo documento). Medido: 100 a la vez sin perder nada.
nom.espacio.max-usuarios=${NOM_MAX_PERSONAS:50}
# Bloqueo tras mas de 5 intentos fallidos.
nom.cuentas.max-intentos=5
nom.cuentas.minutos-bloqueo=15
nom.cuentas.horas-sesion=72
# Cuentas nuevas por hora: desde una misma red y en total (0 = sin límite). Lo del propio equipo no cuenta.
nom.cuentas.registros-hora-red=${NOM_REGISTROS_HORA_RED:30}
# Tope por dispositivo (la app manda el identificador de su equipo): 5 por hora desde un mismo
# dispositivo; desde una misma red, 200 (solo frena a un programa: una escuela entera sale con la misma IP).
# Sin identificador (apps viejas o programas) queda el de arriba, 30 por red.
nom.cuentas.registros-hora-equipo=${NOM_REGISTROS_HORA_EQUIPO:5}
nom.cuentas.registros-hora-red-equipo=${NOM_REGISTROS_HORA_RED_EQUIPO:200}
nom.cuentas.registros-hora=${NOM_REGISTROS_HORA:300}
# Alias nuevos por hora (entrar con el código de un espacio que deja entrar sin cuenta): desde una misma red
# (un salón entero sale con la misma IP) y en total. Sin tope, un código vigente servía para crear cuentas sin fin.
nom.cuentas.alias-hora-red=${NOM_ALIAS_HORA_RED:300}
nom.cuentas.alias-hora=${NOM_ALIAS_HORA:3000}

# ---------------------------------------------------------------- base de datos
# Usuarios, sesiones y preferencias. En la red local: H2 embebido dentro de
# nom.datos (no hay nada que instalar).
spring.datasource.url=jdbc:h2:file:${nom.datos}/nom-db;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE
spring.datasource.username=nom
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.platform=h2
# Pocas conexiones y ninguna ociosa permanente; si la base tarda en responder se espera en lugar de fallar.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=${NOM_DB_ESPERA_MS:30000}
spring.datasource.hikari.initialization-fail-timeout=-1
# Cuota de almacenamiento por cuenta en MB (documentos y versiones de sus espacios). 0 = sin
# limite (red local).
nom.cuota.mb=${NOM_CUOTA_MB:0}
# Almacén de binarios (imágenes y el Office original de cada documento, aparte del documento): tope por archivo.
nom.binarios.max-mb=${NOM_BINARIOS_MAX_MB:48}
